plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.foodwise'
version = '0.0.1-SNAPSHOT'
description = '食刻有数 - 高校食堂精细化经营与食品减损平台'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    maven { url = uri('https://maven.aliyun.com/repository/spring') }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai:2.0.1'
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-mysql:10.20.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Keep both output directories explicit. This avoids Gradle 9's JVM test
    // suite classloader dropping the test output in a non-ASCII project path.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(
        sourceSets.test.output.classesDirs,
        sourceSets.main.output.classesDirs,
        sourceSets.main.output.resourcesDir,
        configurations.testRuntimeClasspath
    )
}
