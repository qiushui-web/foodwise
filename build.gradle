plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.foodwise'
version = '0.0.1-SNAPSHOT'
description = '食刻有数 - 高校食堂精细化经营与食品减损平台'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    maven { url = uri('https://maven.aliyun.com/repository/spring') }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai:2.0.1'
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-mysql:10.20.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    doFirst {
        if (org.gradle.internal.os.OperatingSystem.current().isWindows() &&
                projectDir.absolutePath.any { it.codePointAt(0) > 127 }) {
            def linkRoot = new File(System.getProperty('java.io.tmpdir'), 'foodwise-gradle-link')
            if (!linkRoot.exists()) {
                linkRoot.parentFile.mkdirs()
                def result = new ProcessBuilder('cmd', '/c', 'mklink', '/J', linkRoot.absolutePath, projectDir.absolutePath)
                        .redirectErrorStream(true).start()
                result.waitFor()
            }
            if (linkRoot.isDirectory()) {
                def sourceRoot = projectDir.absolutePath
                def rewrite = { File path ->
                    new File(path.absolutePath.startsWith(sourceRoot)
                            ? linkRoot.absolutePath + path.absolutePath.substring(sourceRoot.length())
                            : path.absolutePath)
                }
                testClassesDirs = files(testClassesDirs.files.collect(rewrite))
                classpath = files(classpath.files.collect(rewrite))
            }
        }
    }
}
